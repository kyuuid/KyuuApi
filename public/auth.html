<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KyuuApi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blood: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' },
                        gold: { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', 800: '#854d0e', 900: '#713f12' },
                        dark: { bg: '#0a0a0f', surface: '#14141e', card: '#1a1a2e' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- LOAD SUPABASE DULUAN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- CONFIG JS -->
    <script src="config.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen p-4" style="background: #0a0a0f;">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-dark-bg/90 backdrop-blur-sm">
        <div class="text-center">
            <div class="w-12 h-12 border-4 border-blood-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-gray-400 text-sm">Memeriksa sesi...</p>
        </div>
    </div>

    <!-- Background Glow -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-blood-600/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 w-[400px] h-[400px] bg-gold-500/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/3 left-0 w-[300px] h-[300px] bg-blood-500/5 rounded-full blur-3xl"></div>
    </div>

    <!-- Blood Rain -->
    <div id="bloodRain" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <style>
            .blood-drop {
                position: absolute;
                width: 2px;
                height: 15px;
                background: linear-gradient(180deg, transparent, rgba(220, 38, 38, 0.4));
                animation: bloodFall linear infinite;
                opacity: 0;
            }
            @keyframes bloodFall {
                0% { transform: translateY(-20px); opacity: 0; }
                10% { opacity: 0.5; }
                90% { opacity: 0.5; }
                100% { transform: translateY(110vh); opacity: 0; }
            }
        </style>
        <script>
            (function() {
                const container = document.getElementById('bloodRain');
                for (let i = 0; i < 30; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'blood-drop';
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.height = (8 + Math.random() * 20) + 'px';
                    drop.style.animationDuration = (5 + Math.random() * 10) + 's';
                    drop.style.animationDelay = (Math.random() * 10) + 's';
                    drop.style.opacity = 0.1 + Math.random() * 0.3;
                    container.appendChild(drop);
                }
            })();
        </script>
    </div>

    <!-- Auth Container -->
    <div class="relative z-10 w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="text-4xl font-black flex items-center justify-center gap-2 no-underline">
                <span class="text-blood-500">Kyuu</span>
                <span class="text-gold-400">Api</span>
            </a>
            <p class="text-gray-500 text-sm mt-2 font-medium tracking-wider">Platform REST API Premium</p>
        </div>

        <!-- Auth Card -->
        <div class="glass rounded-3xl p-6 sm:p-8 border border-blood-500/20 blood-glow">
            
            <!-- Tab Login/Register -->
            <div class="flex bg-black/40 rounded-2xl p-1 mb-6">
                <button id="tab-login" type="button" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 bg-blood-600 text-white shadow-lg shadow-blood-600/20">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Login
                </button>
                <button id="tab-register" type="button" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 text-gray-400 hover:text-white">
                    <i class="fa-solid fa-user-plus mr-2"></i> Daftar
                </button>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <div id="login-form">
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-regular fa-envelope mr-2 text-gold-400"></i> Email
                        </label>
                        <div class="relative">
                            <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="email" 
                                id="login-email" 
                                placeholder="email@example.com" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                                value="kaishinaval@gmail.com"
                            >
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-solid fa-key mr-2 text-gold-400"></i> Password
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="password" 
                                id="login-password" 
                                placeholder="Minimal 6 karakter" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                            >
                        </div>
                    </div>

                    <button id="btn-login" type="button" class="btn-blood w-full text-sm py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-right-to-bracket"></i> Masuk
                    </button>
                    
                    <p class="text-center text-xs text-gray-500 mt-4">
                        Belum punya akun? 
                        <button id="goto-register" type="button" class="text-gold-400 hover:text-gold-300 font-bold transition">
                            Daftar di sini
                        </button>
                    </p>
                </div>
            </div>

            <!-- ===== REGISTER FORM ===== -->
            <div id="register-form" class="hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-regular fa-user mr-2 text-gold-400"></i> Nama Lengkap
                        </label>
                        <div class="relative">
                            <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="text" 
                                id="register-name" 
                                placeholder="Nama kamu" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                            >
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-regular fa-envelope mr-2 text-gold-400"></i> Email
                        </label>
                        <div class="relative">
                            <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="email" 
                                id="register-email" 
                                placeholder="email@example.com" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                            >
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-solid fa-key mr-2 text-gold-400"></i> Password
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="password" 
                                id="register-password" 
                                placeholder="Minimal 6 karakter" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                            >
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-regular fa-id-card mr-2 text-gold-400"></i> Username / ID
                        </label>
                        <div class="relative">
                            <i class="fa-regular fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="text" 
                                id="register-userid" 
                                placeholder="Contoh: kyuuxx" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                            >
                        </div>
                        <p class="text-[10px] text-gray-500 mt-1.5">
                            <i class="fa-regular fa-circle-info mr-1"></i> Digunakan sebagai ID unik (contoh: #kyuuxx)
                        </p>
                    </div>

                    <button id="btn-register" type="button" class="btn-gold w-full text-sm py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-user-plus"></i> Daftar Sekarang
                    </button>
                    
                    <p class="text-center text-xs text-gray-500 mt-4">
                        Sudah punya akun? 
                        <button id="goto-login" type="button" class="text-blood-400 hover:text-blood-300 font-bold transition">
                            Login di sini
                        </button>
                    </p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-[10px] text-gray-600 mt-6 tracking-widest">
            &copy; 2026 KyuuApi — Dark Blood Edition
        </p>
    </div>

    <!-- ============================== -->
    <!-- SCRIPT AUTH LOGIC (DENGAN DETEKSI SESSION) -->
    <!-- ============================== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            'use strict';

            console.log('🔐 Auth page loaded');

            // ===== PAKAI INSTANCE SUPABASE DARI CONFIG.JS / CDN DEKLARASI =====
            let sbClient = null;
            
            try {
                if (typeof window.supabaseClient !== 'undefined') {
                    sbClient = window.supabaseClient;
                } else if (typeof window.supabase !== 'undefined' && typeof CONFIG !== 'undefined') {
                    sbClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
                }

                if (sbClient) {
                    console.log('✅ Supabase Client terhubung!');
                } else {
                    console.error('❌ Supabase Client gagal dimuat. Cek config.js!');
                }
            } catch (err) {
                console.error('❌ Error Supabase Init:', err);
            }

            // ===== CEK SESSION LOGIN =====
            async function checkSession() {
                const loadingOverlay = document.getElementById('loadingOverlay');
                
                if (!sbClient) {
                    loadingOverlay.style.display = 'none';
                    return;
                }

                try {
                    const { data: { session }, error } = await sbClient.auth.getSession();

                    if (error) {
                        console.error('Error checking session:', error);
                        loadingOverlay.style.display = 'none';
                        return;
                    }

                    if (session) {
                        console.log('✅ User sudah login, redirect ke home...');
                        // Redirect ke home
                        window.location.href = 'home.html';
                    } else {
                        console.log('👤 User belum login, tampilkan form');
                        loadingOverlay.style.display = 'none';
                    }
                } catch (err) {
                    console.error('Error checking session:', err);
                    loadingOverlay.style.display = 'none';
                }
            }

            // ===== LISTENER PERUBAHAN SESSION (AUTH STATE CHANGE) =====
            if (sbClient) {
                sbClient.auth.onAuthStateChange((event, session) => {
                    console.log('🔄 Auth state changed:', event, session);
                    
                    if (event === 'SIGNED_IN' && session) {
                        console.log('✅ User signed in, redirecting...');
                        window.location.href = 'home.html';
                    } else if (event === 'SIGNED_OUT') {
                        console.log('👋 User signed out');
                        // Tidak perlu redirect, tetap di halaman login
                    }
                });
            }

            // ===== CEK SESSION SAAT LOAD =====
            checkSession();

            // ===== DOM ELEMENTS =====
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const gotoRegister = document.getElementById('goto-register');
            const gotoLogin = document.getElementById('goto-login');
            const btnLogin = document.getElementById('btn-login');
            const btnRegister = document.getElementById('btn-register');

            // ===== SWITCH TAB =====
            function switchTab(tab) {
                if (tab === 'login') {
                    loginForm.classList.remove('hidden');
                    registerForm.classList.add('hidden');
                    tabLogin.className = 'flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 bg-blood-600 text-white shadow-lg shadow-blood-600/20';
                    tabRegister.className = 'flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 text-gray-400 hover:text-white';
                } else {
                    loginForm.classList.add('hidden');
                    registerForm.classList.remove('hidden');
                    tabRegister.className = 'flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 bg-gold-600 text-white shadow-lg shadow-gold-600/20';
                    tabLogin.className = 'flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 text-gray-400 hover:text-white';
                }
            }

            if(tabLogin) tabLogin.addEventListener('click', () => switchTab('login'));
            if(tabRegister) tabRegister.addEventListener('click', () => switchTab('register'));
            if(gotoRegister) gotoRegister.addEventListener('click', () => switchTab('register'));
            if(gotoLogin) gotoLogin.addEventListener('click', () => switchTab('login'));

            // ===== LOGIN HANDLER =====
            if(btnLogin) {
                btnLogin.addEventListener('click', async function(e) {
                    e.preventDefault();

                    const email = document.getElementById('login-email').value.trim();
                    const password = document.getElementById('login-password').value;

                    if (!email || !password) {
                        alert('❌ Email dan password harus diisi!');
                        return;
                    }

                    if (!sbClient) {
                        alert('❌ Supabase belum terhubung. Cek koneksi / config!');
                        return;
                    }

                    const originalText = btnLogin.innerHTML;
                    btnLogin.disabled = true;
                    btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memproses...';

                    try {
                        const { data, error } = await sbClient.auth.signInWithPassword({ email, password });

                        if (error) {
                            alert('❌ Login gagal: ' + error.message);
                            btnLogin.innerHTML = originalText;
                            btnLogin.disabled = false;
                        } else if (data && data.session) {
                            console.log('✅ Login Berhasil!');
                            // Redirect akan dihandle oleh onAuthStateChange
                            window.location.href = 'home.html';
                        }
                    } catch (err) {
                        alert('Terjadi kesalahan: ' + err.message);
                        btnLogin.innerHTML = originalText;
                        btnLogin.disabled = false;
                    }
                });
            }

            // ===== REGISTER HANDLER =====
            if(btnRegister) {
                btnRegister.addEventListener('click', async function(e) {
                    e.preventDefault();

                    const fullName = document.getElementById('register-name').value.trim();
                    const email = document.getElementById('register-email').value.trim();
                    const password = document.getElementById('register-password').value;
                    const userId = document.getElementById('register-userid').value.trim();

                    if (!fullName || !email || !userId) {
                        alert('❌ Semua kolom pendaftaran wajib diisi!');
                        return;
                    }
                    if (password.length < 6) {
                        alert('❌ Password minimal 6 karakter!');
                        return;
                    }

                    if (!sbClient) {
                        alert('❌ Supabase belum terhubung. Cek koneksi / config!');
                        return;
                    }

                    const originalText = btnRegister.innerHTML;
                    btnRegister.disabled = true;
                    btnRegister.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mendaftar...';

                    try {
                        // Register User via Supabase Auth
                        const { data, error } = await sbClient.auth.signUp({
                            email,
                            password,
                            options: {
                                data: {
                                    full_name: fullName,
                                    username: userId
                                }
                            }
                        });

                        if (error) {
                            alert('❌ Gagal mendaftar: ' + error.message);
                        } else if (data && data.user) {
                            alert('✅ Pendaftaran berhasil!\nSilakan login dengan akun baru kamu.');
                            switchTab('login');
                            document.getElementById('login-email').value = email;
                            document.getElementById('login-password').value = '';
                        }
                    } catch (err) {
                        alert('Terjadi kesalahan: ' + err.message);
                    } finally {
                        btnRegister.innerHTML = originalText;
                        btnRegister.disabled = false;
                    }
                });
            }

            // ===== DUKUNGAN TEKAN ENTER UNTUK SUBMIT =====
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    if (!loginForm.classList.contains('hidden')) {
                        btnLogin.click();
                    } else if (!registerForm.classList.contains('hidden')) {
                        btnRegister.click();
                    }
                }
            });

            // ===== LOGOUT HANDLER (Opsional, untuk testing) =====
            // Tambahkan parameter ?logout di URL untuk logout
            if (window.location.search.includes('logout=true')) {
                if (sbClient) {
                    sbClient.auth.signOut().then(() => {
                        console.log('Logout berhasil');
                        window.history.replaceState({}, document.title, window.location.pathname);
                    });
                }
            }
        });
    </script>
</body>
</html>
