<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KyuuApi - Loading</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blood: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' },
                        gold: { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', 800: '#854d0e', 900: '#713f12' },
                        dark: { bg: '#0a0a0f', surface: '#14141e', card: '#1a1a2e', border: 'rgba(220, 38, 38, 0.15)' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* BLOOD RAIN EFFECT */
        .blood-rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .blood-drop {
            position: absolute;
            width: 3px;
            height: 20px;
            background: linear-gradient(180deg, transparent, rgba(220, 38, 38, 0.8), rgba(239, 68, 68, 0.4));
            animation: bloodFall linear infinite;
            opacity: 0;
        }
        @keyframes bloodFall {
            0% { transform: translateY(-20px) scaleY(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) scaleY(1); opacity: 0; }
        }

        /* LOADING SPINNER GOLD */
        .loading-container {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        .gold-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #eab308;
            border-right-color: #dc2626;
            border-bottom-color: #eab308;
            border-left-color: #dc2626;
            animation: goldSpin 1.2s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            margin: 0 auto 30px;
            box-shadow: 0 0 60px rgba(234, 179, 8, 0.15), 0 0 120px rgba(220, 38, 38, 0.1);
            position: relative;
        }
        .gold-ring::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #dc2626;
            border-left-color: #eab308;
            animation: goldSpin 0.8s linear infinite reverse;
        }
        .gold-ring::before {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            color: #eab308;
            animation: pulseGold 1.5s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(234, 179, 8, 0.4);
        }
        @keyframes goldSpin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulseGold {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        .loading-text {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #dc2626, #eab308, #dc2626);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 2s ease-in-out infinite;
            letter-spacing: 4px;
            text-shadow: 0 0 40px rgba(220, 38, 38, 0.15);
        }
        @keyframes shimmerText {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .loading-sub {
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 12px;
            animation: fadeSub 1.5s ease-in-out infinite;
        }
        @keyframes fadeSub {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .progress-bar {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin: 25px auto 0;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #dc2626, #eab308, #dc2626);
            border-radius: 10px;
            animation: progressLoad 2.5s ease-in-out forwards;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.2);
        }
        @keyframes progressLoad {
            0% { width: 0%; }
            20% { width: 15%; }
            50% { width: 45%; }
            75% { width: 75%; }
            100% { width: 100%; }
        }

        .version-tag {
            position: fixed;
            bottom: 30px;
            right: 30px;
            color: rgba(255,255,255,0.08);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 300;
            z-index: 1;
        }

        /* Glow border effect */
        .glow-border {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(220, 38, 38, 0.03) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(234, 179, 8, 0.03) 0%, transparent 60%);
        }

        /* Particle gold glints */
        .glint {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #eab308;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.3);
            animation: glintFloat 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
        }
        @keyframes glintFloat {
            0%, 100% { opacity: 0; transform: translate(0, 0) scale(0); }
            20% { opacity: 0.6; transform: translate(10px, -20px) scale(1); }
            80% { opacity: 0.6; transform: translate(-5px, -80px) scale(1); }
            100% { opacity: 0; transform: translate(0, -100px) scale(0); }
        }
    </style>
</head>
<body>

    <div class="glow-border"></div>

    <!-- Blood Rain -->
    <div class="blood-rain-container" id="bloodRain"></div>

    <!-- Gold Glints -->
    <div id="glints"></div>

    <!-- Loading Content -->
    <div class="loading-container">
        <div class="gold-ring"></div>
        <div class="loading-text">KYUUAPI</div>
        <div class="loading-sub">• Initializing Core •</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <div class="version-tag">v1.0.0 • BLOOD EDITION</div>

    <script>
        // Blood Rain Generator
        (function createBloodRain() {
            const container = document.getElementById('bloodRain');
            const drops = 45;
            for (let i = 0; i < drops; i++) {
                const drop = document.createElement('div');
                drop.className = 'blood-drop';
                drop.style.left = Math.random() * 100 + '%';
                drop.style.height = (10 + Math.random() * 30) + 'px';
                drop.style.animationDuration = (4 + Math.random() * 8) + 's';
                drop.style.animationDelay = (Math.random() * 10) + 's';
                drop.style.opacity = 0.1 + Math.random() * 0.3;
                container.appendChild(drop);
            }
        })();

        // Gold Glints
        (function createGlints() {
            const container = document.getElementById('glints');
            for (let i = 0; i < 12; i++) {
                const glint = document.createElement('div');
                glint.className = 'glint';
                glint.style.left = Math.random() * 100 + '%';
                glint.style.top = Math.random() * 100 + '%';
                glint.style.animationDelay = (Math.random() * 8) + 's';
                glint.style.animationDuration = (6 + Math.random() * 6) + 's';
                glint.style.width = (2 + Math.random() * 4) + 'px';
                glint.style.height = glint.style.width;
                container.appendChild(glint);
            }
        })();

        // Redirect setelah loading
        setTimeout(() => {
            // Check if user is logged in via Supabase
            const checkSession = async () => {
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) {
                        window.location.href = 'home.html';
                    } else {
                        window.location.href = 'auth.html';
                    }
                } catch {
                    window.location.href = 'auth.html';
                }
            };
            
            // Load Supabase config
            const script = document.createElement('script');
            script.src = 'config.js';
            script.onload = () => {
                const supabaseScript = document.createElement('script');
                supabaseScript.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                supabaseScript.onload = () => {
                    window.supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
                    checkSession();
                };
                document.head.appendChild(supabaseScript);
            };
            script.onerror = () => {
                // Fallback: langsung ke auth
                window.location.href = 'auth.html';
            };
            document.head.appendChild(script);
        }, 3500);
    </script>
</body>
</html>
