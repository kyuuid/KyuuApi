<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - KyuuApi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blood: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' },
                        gold: { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', 800: '#854d0e', 900: '#713f12' },
                        dark: { bg: '#0a0a0f', surface: '#14141e', card: '#1a1a2e', border: 'rgba(220, 38, 38, 0.15)' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <!-- Supabase & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-dark-bg text-white min-h-screen antialiased">

    <!-- NAVBAR -->
    <nav class="glass-nav fixed top-0 left-0 right-0 z-50 px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="max-w-5xl mx-auto w-full flex justify-between items-center">
            <a href="home.html" class="text-xl font-black flex items-center gap-2">
                <span class="text-blood-500">Kyuu</span>
                <span class="text-gold-400">Api</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="home.html" class="text-sm text-gray-400 hover:text-white transition font-medium">
                    <i class="fa-solid fa-house"></i>
                </a>
                <a href="docs.html" class="text-sm text-gray-400 hover:text-gold-400 transition font-medium">Docs</a>
                <button onclick="logout()" class="text-xs bg-blood-600/20 hover:bg-blood-600/40 text-blood-400 px-3 py-1.5 rounded-lg font-bold transition border border-blood-500/20">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 mt-16">
        
        <!-- PROFIL CARD HEADER -->
        <div class="glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden mb-8 bg-[#14141e]/50 border border-white/5">
            <div id="profile-banner" class="absolute top-0 left-0 w-full h-36 sm:h-40 bg-gradient-to-r from-blood-900/60 via-dark-surface to-black z-0 border-b border-white/10 bg-cover bg-center transition-all duration-300"></div>
            
            <div class="relative z-10 flex flex-col md:flex-row items-center md:items-end gap-6 mt-16 sm:mt-20">
                <!-- AVATAR -->
                <div class="relative shrink-0">
                    <img id="profile-img" src="https://via.placeholder.com/150" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full border-4 border-[#0a0a0f] object-cover bg-dark-card shadow-2xl">
                </div>

                <!-- USER INFO -->
                <div class="text-center md:text-left flex-1 mb-1 w-full">
                    <div class="flex flex-wrap items-center justify-center md:justify-start gap-2.5">
                        <h1 id="profile-name" class="text-2xl sm:text-3xl font-black text-white tracking-tight">Memuat...</h1>
                        <span id="profile-id" class="bg-blood-900/40 border border-blood-500/30 px-2.5 py-0.5 rounded-lg text-xs text-blood-300 font-mono font-bold">#--</span>
                    </div>
                    
                    <div class="mt-2.5 mb-2 flex flex-col sm:flex-row items-center justify-center md:justify-start gap-3">
                        <p class="text-xs sm:text-sm uppercase tracking-widest font-extrabold"><span id="profile-role">Memuat...</span></p>
                        <button onclick="openEditModal()" class="bg-white/5 hover:bg-blood-600 border border-white/10 hover:border-blood-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition-all shadow-lg flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square text-gold-400"></i> Edit Profil
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- API KEY SECTION -->
        <div class="glass-panel rounded-3xl p-6 mb-8 bg-[#14141e]/50 border border-white/5">
            <h3 class="text-sm font-black text-white flex items-center gap-2 mb-3">
                <i class="fa-solid fa-key text-gold-400"></i> API Key
            </h3>
            <div class="flex flex-col sm:flex-row items-center gap-3">
                <div class="bg-black/40 border border-white/10 px-4 py-2 rounded-xl flex-1 text-sm font-mono text-gray-300 w-full overflow-hidden text-ellipsis" id="api-key-display">Memuat...</div>
                <button onclick="copyApiKey()" class="bg-gold-500/20 hover:bg-gold-500/40 text-gold-400 border border-gold-500/30 rounded-xl font-bold transition text-sm px-4 py-2 whitespace-nowrap w-full sm:w-auto">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>
            <p class="text-[10px] text-gray-500 mt-2">
                <i class="fa-solid fa-shield-halved mr-1"></i> API Key ini permanen dan digunakan untuk autentikasi setiap request ke KyuuApi.
            </p>
        </div>

        <!-- CARD STATISTIK -->
        <div class="max-w-2xl mx-auto">
            <div class="glass-panel rounded-3xl p-6 sm:p-7 bg-[#14141e]/50 border border-white/5">
                <h3 class="text-base sm:text-lg font-black text-white mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-gold-400"></i> Statistik Akun
                </h3>
                <ul class="text-xs sm:text-sm text-gray-300 space-y-3.5" id="stat-list">
                    <li class="flex justify-between items-center bg-black/30 p-4 rounded-2xl border border-white/5">
                        <span class="font-bold text-gray-400 flex items-center gap-2.5"><i class="fa-solid fa-calendar-days text-blood-400"></i>Bergabung</span>
                        <span id="stat-join" class="font-extrabold text-white">-</span>
                    </li>
                    <li class="flex justify-between items-center bg-black/30 p-4 rounded-2xl border border-white/5">
                        <span class="font-bold text-gray-400 flex items-center gap-2.5"><i class="fa-solid fa-shield-check text-emerald-400"></i>Status</span>
                        <span class="font-black text-emerald-400 tracking-wider uppercase text-xs"><i class="fa-solid fa-circle-check mr-1"></i> Aktif</span>
                    </li>
                    <li class="flex justify-between items-center bg-black/30 p-4 rounded-2xl border border-white/5">
                        <span class="font-bold text-gray-400 flex items-center gap-2.5"><i class="fa-solid fa-crown text-gold-400"></i>Plan</span>
                        <span id="stat-plan" class="font-black text-gold-400 text-xs uppercase">Memuat...</span>
                    </li>
                    <li class="flex justify-between items-center bg-black/30 p-4 rounded-2xl border border-white/5">
                        <span class="font-bold text-gray-400 flex items-center gap-2.5"><i class="fa-solid fa-server text-blood-400"></i>Requests Hari Ini</span>
                        <span id="stat-requests" class="font-black text-white">0</span>
                    </li>
                </ul>
            </div>
        </div>

    </main>

    <!-- MODAL EDIT PROFIL -->
    <div id="edit-profile-modal" class="fixed inset-0 bg-black/85 flex items-center justify-center z-[100] hidden backdrop-blur-md px-4 transition-opacity">
        <div class="glass-panel rounded-3xl w-full max-w-md overflow-hidden shadow-2xl border border-blood-500/20 bg-[#0a0a0f] p-6 sm:p-7">
            <h3 class="text-lg font-black text-white mb-5 flex items-center gap-2.5">
                <i class="fa-solid fa-user-gear text-gold-400"></i> Kustomisasi Profil
            </h3>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-[11px] font-extrabold uppercase text-gray-400 tracking-wider mb-1.5">Nama Tampilan</label>
                    <input type="text" id="edit-name" class="w-full bg-black/40 text-xs sm:text-sm text-white px-4 py-3 rounded-xl border border-white/10 focus:outline-none focus:border-blood-500 transition">
                </div>
                <div>
                    <label class="block text-[11px] font-extrabold uppercase text-gray-400 tracking-wider mb-1.5">Foto Profil</label>
                    <input type="file" id="edit-avatar-file" accept="image/*" class="w-full bg-black/40 text-xs text-white px-3.5 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-blood-500 transition file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blood-600 file:text-white hover:file:bg-blood-500 cursor-pointer">
                </div>
                <div>
                    <label class="block text-[11px] font-extrabold uppercase text-gray-400 tracking-wider mb-1.5">Banner Atas</label>
                    <input type="file" id="edit-banner-file" accept="image/*" class="w-full bg-black/40 text-xs text-white px-3.5 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-blood-500 transition file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blood-600 file:text-white hover:file:bg-blood-500 cursor-pointer">
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="closeEditModal()" class="w-1/2 py-3 bg-white/5 hover:bg-white/10 text-gray-300 font-bold rounded-xl transition text-xs sm:text-sm">Batal</button>
                <button onclick="saveProfileChanges()" id="btn-save-profile" class="w-1/2 py-3 bg-blood-600 hover:bg-blood-500 text-white font-bold rounded-xl transition text-xs sm:text-sm">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        let supabase;
        let currentUser = null;
        let currentProfile = null;

        async function loadProfile() {
    try {
        // 1. Verifikasi Config
        if (typeof supabaseClient === 'undefined') {
            throw new Error("supabaseClient tidak terdeteksi. Pastikan script config.js berhasil di-load tanpa 404.");
        }
        supabase = supabaseClient;

        // 2. Cek Sesi Auth
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        
        if (sessionError || !session) {
            console.warn("Tidak ada sesi aktif, mengalihkan ke login...");
            window.location.href = 'auth.html';
            return;
        }

        currentUser = session.user;

        // 3. Tarik Data Profil
        let { data: profile, error: profileError } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .single();

        // 4. AUTO-FIX: Jika tabel kosong untuk user ini (PGRST116)
        if (profileError && profileError.code === 'PGRST116') {
            console.log("Profil belum ada. Mengeksekusi Auto-Create Profile...");
            
            const { data: newProfile, error: insertError } = await supabase
                .from('profiles')
                .insert([{
                    id: currentUser.id,
                    full_name: currentUser.user_metadata?.full_name || 'Member Baru',
                    role: 'member',
                    plan: 'free',
                    requests_today: 0
                }])
                .select()
                .single();
                
            if (insertError) throw insertError;
            profile = newProfile; // Gunakan profil yang baru dibuat
            
        } else if (profileError) {
            throw profileError; // Lempar error jika masalahnya bukan karena tabel kosong
        }
        
        // 5. Render ke Layar
        currentProfile = profile;
        renderProfileData(currentProfile);

    } catch (err) {
        console.error("Gagal memuat profil:", err);
        
        // Memaksa UI berubah dari "Memuat..." agar Anda tahu ada yang salah
        currentProfile = {
            id: currentUser?.id || 'error-123',
            full_name: 'Database Error',
            user_id: '999',
            avatar_url: 'https://via.placeholder.com/150',
            api_key: 'Belum dibuat',
            plan: 'free',
            requests_today: 0,
            role: 'member',
            created_at: new Date().toISOString(),
            banner_url: ''
        };
        renderProfileData(currentProfile);
        
        // Munculkan alert agar pesan error terbaca jelas
        alert("Gagal memuat data dari database:\n" + err.message);
    }
}

        function renderProfileData(profile) {
            document.getElementById('profile-name').innerText = profile.full_name || 'Tanpa Nama';
            document.getElementById('profile-id').innerText = `#${profile.user_id || '000000'}`;
            document.getElementById('profile-img').src = profile.avatar_url || 'https://via.placeholder.com/150';

            // Auto-Generate / Assign API Key Permanen
            let currentApiKey = profile.api_key;
            if (!currentApiKey || currentApiKey.trim() === '' || currentApiKey === 'Belum dibuat') {
                // Generate format awalan kyuu_{random}
                currentApiKey = 'kyuu_' + Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 6);
                
                // Simpan ke database jika bukan mock data
                if (supabase && currentUser.id !== 'mock-1234') {
                    supabase.from('profiles')
                        .update({ api_key: currentApiKey })
                        .eq('id', currentUser.id)
                        .then(({ error }) => {
                            if(error) console.error("Gagal menyimpan API Key baru", error);
                        });
                }
            }
            document.getElementById('api-key-display').innerText = currentApiKey;

            // Plan Info dengan Icon
            document.getElementById('stat-plan').innerHTML = profile.plan === 'premium' ? 
                '<i class="fa-solid fa-star text-gold-400 mr-1"></i> Premium' : 
                '<i class="fa-solid fa-user text-gray-400 mr-1"></i> Free';
            document.getElementById('stat-requests').innerText = profile.requests_today || 0;

            // Banner
            const bannerEl = document.getElementById('profile-banner');
            if (profile.banner_url && profile.banner_url.trim() !== "") {
                bannerEl.classList.remove('bg-gradient-to-r', 'from-blood-900/60', 'via-dark-surface', 'to-black');
                bannerEl.style.backgroundImage = `url('${profile.banner_url.trim()}')`;
            } else {
                bannerEl.style.backgroundImage = 'none';
                bannerEl.classList.add('bg-gradient-to-r', 'from-blood-900/60', 'via-dark-surface', 'to-black');
            }

            // Join date
            const date = new Date(profile.created_at);
            document.getElementById('stat-join').innerText = date.toLocaleDateString('id-ID', {
                year: 'numeric', month: 'short', day: 'numeric'
            });

            // Role dengan FontAwesome Icons (Premium Look)
            const roleSpan = document.getElementById('profile-role');
            if (profile.role === 'owner') {
                roleSpan.innerHTML = '<i class="fa-solid fa-crown mr-1"></i> Owner';
                roleSpan.className = 'text-gold-400 font-bold';
            } else if (profile.role === 'breaker') {
                roleSpan.innerHTML = '<i class="fa-solid fa-fire mr-1"></i> Breaker';
                roleSpan.className = 'text-blood-400 font-bold';
            } else if (profile.role === 'nolep') {
                roleSpan.innerHTML = '<i class="fa-solid fa-droplet mr-1"></i> Nolep';
                roleSpan.className = 'text-rose-500 font-bold text-[14px]';
            } else {
                roleSpan.innerHTML = '<i class="fa-solid fa-user mr-1"></i> Member';
                roleSpan.className = 'text-blue-400 font-bold';
            }
        }

        // ===== API KEY =====
        function copyApiKey() {
            const key = document.getElementById('api-key-display').innerText;
            if (key && key !== 'Memuat...') {
                navigator.clipboard.writeText(key);
                alert('API Key berhasil disalin!');
            }
        }

        // ===== EDIT PROFIL =====
        function openEditModal() {
            document.getElementById('edit-name').value = currentProfile?.full_name || '';
            document.getElementById('edit-avatar-file').value = '';
            document.getElementById('edit-banner-file').value = '';
            document.getElementById('edit-profile-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-profile-modal').classList.add('hidden');
        }

        async function uploadImageToSupabase(file, folderName) {
            if(!supabase || currentUser.id === 'mock-1234') return 'https://via.placeholder.com/150';
            
            const fileExt = file.name.split('.').pop();
            const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;
            const filePath = `${folderName}/${fileName}`;

            const { error: uploadError } = await supabase.storage
                .from('user_content')
                .upload(filePath, file, { upsert: true });

            if (uploadError) return null;
            const { data } = supabase.storage.from('user_content').getPublicUrl(filePath);
            return data.publicUrl;
        }

        async function saveProfileChanges() {
            const btn = document.getElementById('btn-save-profile');
            btn.innerText = 'Menyimpan...';
            btn.disabled = true;

            const name = document.getElementById('edit-name').value.trim();
            const avatarFile = document.getElementById('edit-avatar-file').files[0];
            const bannerFile = document.getElementById('edit-banner-file').files[0];

            if (!name) {
                alert('Nama tidak boleh kosong!');
                btn.innerText = 'Simpan';
                btn.disabled = false;
                return;
            }

            let updateData = { full_name: name };

            if (avatarFile) {
                const url = await uploadImageToSupabase(avatarFile, 'avatars');
                if (url) updateData.avatar_url = url;
            }
            if (bannerFile) {
                const url = await uploadImageToSupabase(bannerFile, 'banners');
                if (url) updateData.banner_url = url;
            }

            if(supabase && currentUser.id !== 'mock-1234') {
                const { error } = await supabase
                    .from('profiles')
                    .update(updateData)
                    .eq('id', currentUser.id);

                if (error) {
                    alert('Gagal: ' + error.message);
                    btn.innerText = 'Simpan';
                    btn.disabled = false;
                    return;
                }
            }

            btn.innerText = 'Simpan';
            btn.disabled = false;
            closeEditModal();
            loadProfile();
        }

        // ===== LOGOUT =====
        async function logout() {
            if(supabase && currentUser.id !== 'mock-1234') {
                await supabase.auth.signOut();
            }
            window.location.href = 'auth.html';
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
