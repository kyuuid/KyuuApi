<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokumentasi - KyuuApi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blood: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' },
                        gold: { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', 800: '#854d0e', 900: '#713f12' },
                        dark: { bg: '#0a0a0f', surface: '#14141e', card: '#1a1a2e', border: 'rgba(220, 38, 38, 0.15)' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ========================================
           KYUUAPI - DARK BLOOD RED GLASSMORPHISM
           + GOLD BLING / NEON GLOW
           ======================================== */

        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');

        /* ===== ROOT VARIABLES ===== */
        :root {
            /* Blood Red */
            --blood-50: #fef2f2;
            --blood-100: #fee2e2;
            --blood-200: #fecaca;
            --blood-300: #fca5a5;
            --blood-400: #f87171;
            --blood-500: #ef4444;
            --blood-600: #dc2626;
            --blood-700: #b91c1c;
            --blood-800: #991b1b;
            --blood-900: #7f1d1d;
            
            /* Gold */
            --gold-50: #fefce8;
            --gold-100: #fef9c3;
            --gold-200: #fef08a;
            --gold-300: #fde047;
            --gold-400: #facc15;
            --gold-500: #eab308;
            --gold-600: #ca8a04;
            --gold-700: #a16207;
            --gold-800: #854d0e;
            --gold-900: #713f12;
            
            /* Dark */
            --dark-bg: #0a0a0f;
            --dark-surface: #14141e;
            --dark-card: #1a1a2e;
            --dark-border: rgba(220, 38, 38, 0.15);
            
            /* Glass */
            --glass-bg: rgba(26, 26, 46, 0.6);
            --glass-border: rgba(220, 38, 38, 0.12);
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html.dark {
            background-color: var(--dark-bg);
        }

        body {
            background-color: var(--dark-bg);
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.5s ease;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--blood-600), var(--gold-500));
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--blood-500), var(--gold-400));
        }

        /* ===== GLASSMORPHISM ===== */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .glass-light {
            background: rgba(26, 26, 46, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(220, 38, 38, 0.08);
        }

        .glass-nav {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(220, 38, 38, 0.1);
        }

        .glass-panel {
            background: rgba(19, 27, 46, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
        }

        /* ===== GLOW EFFECTS ===== */
        .blood-glow {
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.15), 0 0 60px rgba(220, 38, 38, 0.05);
        }
        .blood-glow-hover:hover {
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.25), 0 0 80px rgba(220, 38, 38, 0.08);
        }
        .gold-glow {
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.15), 0 0 60px rgba(234, 179, 8, 0.05);
        }
        .blood-pulse {
            animation: bloodPulse 2s ease-in-out infinite;
        }
        @keyframes bloodPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.1); }
            50% { box-shadow: 0 0 40px rgba(220, 38, 38, 0.3), 0 0 80px rgba(220, 38, 38, 0.1); }
        }

        /* ===== BUTTONS ===== */
        .btn-blood {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.2);
        }
        .btn-blood:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.3);
        }

        .btn-gold {
            background: linear-gradient(135deg, #eab308, #a16207);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(234, 179, 8, 0.2);
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(234, 179, 8, 0.3);
        }

        .btn-outline-blood {
            background: transparent;
            color: #dc2626;
            border: 1.5px solid #dc2626;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .btn-outline-blood:hover {
            background: rgba(220, 38, 38, 0.1);
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.1);
        }

        /* ===== INPUTS ===== */
        .input-blood {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(220, 38, 38, 0.15);
            color: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
            width: 100%;
        }
        .input-blood:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.1);
        }
        .input-blood::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
    </style>
    
    <!-- LOAD SUPABASE DAN CONFIG -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>

    <main class="pt-20 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-8">

    <!-- ============================================== -->
    <!-- LOGIKA JAVASCRIPT UTAMA -->
    <!-- ============================================== -->
    <script>
        let endpoints = [];
        let currentEndpoint = null;
        let testApiKey = 'YOUR_API_KEY';
        let currentUserRole = 'member';
        let sbClient = null;

        const BASE_URL = 'https://kyuuapi.eu.cc/api/v1';

        async function initDocs() {
            // Setup Supabase
            if (typeof window.supabaseClient !== 'undefined') {
                sbClient = window.supabaseClient;
            } else if (typeof window.supabase !== 'undefined' && typeof window.CONFIG !== 'undefined') {
                sbClient = window.supabase.createClient(window.CONFIG.SUPABASE_URL, window.CONFIG.SUPABASE_ANON_KEY);
            }

            if (!sbClient) {
                document.getElementById('endpoints-container').innerHTML = '<div class="text-center text-red-500 py-10">Gagal terhubung ke Supabase. Cek file config.js Anda!</div>';
                return;
            }

            // Cek Sesi User & Role
            const { data: { session } } = await sbClient.auth.getSession();
            if (session) {
                const { data: profile } = await sbClient.from('profiles').select('role, api_key').eq('id', session.user.id).single();
                if (profile) {
                    currentUserRole = profile.role || 'member';
                    if (profile.api_key) testApiKey = profile.api_key;
                    document.getElementById('test-api-key').value = testApiKey;
                }
            }

            // Render Tampilan Owner (Jika user adalah Owner)
            renderAdminControls();

            // Load Endpoints dari Database Supabase
            await fetchEndpointsFromDB();
        }

        async function fetchEndpointsFromDB() {
            const container = document.getElementById('endpoints-container');
            container.innerHTML = '<div class="text-center py-12 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2">Mengambil data dari database...</p></div>';

            const { data, error } = await sbClient.from('endpoints').select('*').order('created_at', { ascending: true });

            if (error) {
                container.innerHTML = `<div class="text-center text-red-500 py-10">Error memuat data: ${error.message}</div>`;
                return;
            }

            endpoints = data || [];
            renderEndpoints(endpoints);
        }

        function renderAdminControls() {
            if (currentUserRole !== 'owner') return;

            const adminDiv = document.createElement('div');
            adminDiv.className = "glass rounded-2xl p-4 mb-6 border-2 border-gold-500/30 bg-gold-500/5";
            adminDiv.innerHTML = `
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-black text-gold-400 uppercase tracking-widest"><i class="fa-solid fa-crown mr-2"></i>Admin Panel Mode</h3>
                    <button onclick="openAddEndpointModal()" class="btn-gold text-xs px-4 py-2">
                        <i class="fa-solid fa-plus mr-1"></i> Tambah Endpoint
                    </button>
                </div>
                <p class="text-xs text-gray-400 mt-1">Anda login sebagai Owner. Anda berhak menambah dan menghapus data Endpoint.</p>
            `;
            
            const filterSection = document.querySelector('.filter-section');
            if(filterSection) filterSection.parentNode.insertBefore(adminDiv, filterSection);
        }

        function renderEndpoints(filteredList) {
            const container = document.getElementById('endpoints-container');
            
            if (filteredList.length === 0) {
                container.innerHTML = `
                    <div class="glass rounded-2xl p-8 text-center">
                        <i class="fa-solid fa-server text-2xl text-gray-500"></i>
                        <p class="text-gray-400 mt-2">Tidak ada endpoint yang ditemukan.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filteredList.map(ep => {
                const methodColors = {
                    'GET': 'text-emerald-400 bg-emerald-400/10',
                    'POST': 'text-blue-400 bg-blue-400/10',
                    'PUT': 'text-amber-400 bg-amber-400/10',
                    'DELETE': 'text-red-400 bg-red-400/10'
                };
                
                const deleteBtn = currentUserRole === 'owner' ? `
                    <button onclick="deleteEndpoint('${ep.id}')" title="Hapus Endpoint Ini" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 text-xs px-3 py-1.5 rounded-lg font-bold transition ml-2">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                ` : '';
                
                return `
                <div class="glass rounded-2xl p-5 hover:border-blood-500/20 transition border border-transparent">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex items-center gap-3 flex-wrap">
                            <span class="text-[10px] font-black px-2.5 py-0.5 rounded ${methodColors[ep.method] || 'text-gray-400 bg-gray-400/10'}">${ep.method}</span>
                            <span class="font-mono text-sm text-gold-400">${ep.path}</span>
                            <span class="text-xs text-gray-500 hidden sm:inline">•</span>
                            <span class="text-xs text-gray-400 uppercase font-bold">${ep.category}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="testEndpoint('${ep.id}')" class="btn-gold text-xs px-4 py-1.5">
                                <i class="fa-solid fa-code"></i> Lihat Docs
                            </button>
                            <button onclick="copyEndpointUrl('${ep.path}')" class="btn-outline-blood text-xs px-3 py-1.5">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                            ${deleteBtn}
                        </div>
                    </div>
                    <p class="text-sm text-gray-400 mt-2">${ep.description || 'Tidak ada deskripsi'}</p>
                </div>
            `}).join('');
        }

        // ==========================================
        // FUNGSI ADMIN (TAMBAH & HAPUS)
        // ==========================================
        
        function openAddEndpointModal() {
            document.getElementById('new-ep-name').value = '';
            document.getElementById('new-ep-path').value = '';
            document.getElementById('new-ep-desc').value = '';
            document.getElementById('add-endpoint-modal').classList.remove('hidden');
        }

        function closeAddEndpointModal() {
            document.getElementById('add-endpoint-modal').classList.add('hidden');
        }

        async function saveNewEndpoint() {
            const btn = document.getElementById('btn-save-ep');
            const name = document.getElementById('new-ep-name').value.trim();
            const path = document.getElementById('new-ep-path').value.trim();
            const method = document.getElementById('new-ep-method').value;
            const category = document.getElementById('new-ep-category').value;
            const desc = document.getElementById('new-ep-desc').value.trim();

            if (!name || !path) {
                alert('Nama dan Path endpoint wajib diisi!');
                return;
            }

            btn.innerText = 'Menyimpan...';
            btn.disabled = true;

            const newData = {
                name: name,
                path: path,
                method: method,
                category: category,
                description: desc,
                params: [], // Default array params
                mock: { status: "success", message: "Ini adalah mock response dari database" }
            };

            const { error } = await sbClient.from('endpoints').insert([newData]);
            
            if (error) {
                alert("Gagal tambah endpoint: " + error.message);
            } else {
                alert("Endpoint berhasil ditambahkan ke database!");
                closeAddEndpointModal();
                fetchEndpointsFromDB(); // Reload list
            }

            btn.innerText = 'Simpan Data';
            btn.disabled = false;
        }

        async function deleteEndpoint(id) {
            if (!confirm("PERINGATAN! Yakin ingin menghapus endpoint ini dari database secara permanen?")) return;
            
            const { error } = await sbClient.from('endpoints').delete().eq('id', id);
            
            if (error) {
                alert("Gagal menghapus: " + error.message);
            } else {
                fetchEndpointsFromDB();
            }
        }


        // ==========================================
        // FUNGSI FILTER & UTILITY 
        // ==========================================

        function filterEndpoints() {
            const search = document.getElementById('search-endpoint').value.toLowerCase();
            const method = document.getElementById('filter-method').value;
            const category = document.getElementById('filter-category').value;
            
            const filtered = endpoints.filter(ep => {
                const matchSearch = ep.path.toLowerCase().includes(search) || 
                                   (ep.description && ep.description.toLowerCase().includes(search)) ||
                                   ep.name.toLowerCase().includes(search);
                const matchMethod = method === 'all' || ep.method === method;
                const matchCategory = category === 'all' || ep.category === category;
                return matchSearch && matchMethod && matchCategory;
            });
            
            renderEndpoints(filtered);
        }

        function copyEndpointUrl(path) {
            const url = BASE_URL + path;
            navigator.clipboard.writeText(url);
            alert('URL Endpoint berhasil disalin:\n' + url);
        }

        // ==========================================
        // FUNGSI TEST CONSOLE (DOKUMENTASI KODE)
        // ==========================================

        function testEndpoint(id) {
            currentEndpoint = endpoints.find(e => e.id === id);
            if (!currentEndpoint) return;
            
            document.getElementById('test-method-badge').innerText = currentEndpoint.method;
            
            // Atur warna badge method
            let badgeClass = 'text-xs px-2 py-0.5 rounded font-bold ';
            if (currentEndpoint.method === 'GET') badgeClass += 'text-emerald-400 bg-emerald-400/10';
            else if (currentEndpoint.method === 'POST') badgeClass += 'text-blue-400 bg-blue-400/10';
            else if (currentEndpoint.method === 'PUT') badgeClass += 'text-amber-400 bg-amber-400/10';
            else badgeClass += 'text-red-400 bg-red-400/10';
            
            document.getElementById('test-method-badge').className = badgeClass;
            document.getElementById('test-path').innerText = currentEndpoint.path;
            
            // Render Parameters info (jika ada)
            const paramsDiv = document.getElementById('test-params');
            if (currentEndpoint.params && currentEndpoint.params.length > 0) {
                paramsDiv.innerHTML = `
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Parameters yang diperlukan</label>
                    <ul class="text-sm text-gray-300 mt-2 list-disc pl-5">
                        ${currentEndpoint.params.map(p => `<li><span class="text-gold-400 font-mono">${p.name}</span> - ${p.description || 'Tidak ada deskripsi'}</li>`).join('')}
                    </ul>
                `;
            } else {
                paramsDiv.innerHTML = '<p class="text-sm text-gray-500 italic">Endpoint ini tidak memerlukan parameter khusus.</p>';
            }

            // Tampilkan Response Dummy
            document.getElementById('test-response').innerText = JSON.stringify(currentEndpoint.mock || { info: "No mock data" }, null, 2);
            
            // Reset panel code
            document.getElementById('code-display').innerText = "Pilih bahasa di atas untuk melihat contoh kode lengkap dengan API Key Anda.";

            document.getElementById('test-modal').classList.remove('hidden');
        }

        function closeTestModal() {
            document.getElementById('test-modal').classList.add('hidden');
        }

        function showCode(lang) {
            const ep = currentEndpoint;
            if (!ep) return;
            
            let code = '';
            switch(lang) {
                case 'curl':
                    code = `curl -X ${ep.method} "${BASE_URL}${ep.path}" \\
  -H "Authorization: Bearer ${testApiKey}" \\
  -H "Content-Type: application/json"`;
                    break;
                case 'js':
                    code = `fetch("${BASE_URL}${ep.path}", {
  method: "${ep.method}",
  headers: {
    "Authorization": "Bearer ${testApiKey}",
    "Content-Type": "application/json"
  }
})
.then(res => res.json())
.then(data => console.log(data))
.catch(err => console.error(err));`;
                    break;
                case 'python':
                    code = `import requests

url = "${BASE_URL}${ep.path}"
headers = {
    "Authorization": "Bearer ${testApiKey}",
    "Content-Type": "application/json"
}

response = requests.${ep.method.toLowerCase()}(url, headers=headers)
print(response.json())`;
                    break;
                case 'php':
                    code = `<?php
$curl = curl_init();

curl_setopt_array($curl, [
    CURLOPT_URL => "${BASE_URL}${ep.path}",
    CURLOPT_RETURNTRANSFER => true,
    CURLOPT_CUSTOMREQUEST => "${ep.method}",
    CURLOPT_HTTPHEADER => [
        "Authorization: Bearer ${testApiKey}",
        "Content-Type: application/json"
    ]
]);

$response = curl_exec($curl);
$data = json_decode($response, true);
print_r($data);
?>`;
                    break;
            }
            
            document.getElementById('code-display').innerText = code;
        }

        async function logout() {
            if (sbClient) await sbClient.auth.signOut();
            window.location.href = 'auth.html';
        }

        // ==========================================
        // INIT PADA SAAT PAGE LOAD
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            initDocs();
            
            // Event listener buat kolom pencarian
            document.getElementById('search-endpoint').addEventListener('input', filterEndpoints);
            document.getElementById('filter-method').addEventListener('change', filterEndpoints);
            document.getElementById('filter-category').addEventListener('change', filterEndpoints);
        });
    </script>
</body>
</html>
