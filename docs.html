<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokumentasi - KyuuApi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blood: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' },
                        gold: { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', 800: '#854d0e', 900: '#713f12' },
                        dark: { bg: '#0a0a0f', surface: '#14141e', card: '#1a1a2e', border: 'rgba(220, 38, 38, 0.15)' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ========================================
           KYUUAPI - DARK BLOOD RED GLASSMORPHISM
           + GOLD BLING / NEON GLOW
           ======================================== */

        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');

        /* ===== ROOT VARIABLES ===== */
        :root {
            /* Blood Red */
            --blood-50: #fef2f2;
            --blood-100: #fee2e2;
            --blood-200: #fecaca;
            --blood-300: #fca5a5;
            --blood-400: #f87171;
            --blood-500: #ef4444;
            --blood-600: #dc2626;
            --blood-700: #b91c1c;
            --blood-800: #991b1b;
            --blood-900: #7f1d1d;
            
            /* Gold */
            --gold-50: #fefce8;
            --gold-100: #fef9c3;
            --gold-200: #fef08a;
            --gold-300: #fde047;
            --gold-400: #facc15;
            --gold-500: #eab308;
            --gold-600: #ca8a04;
            --gold-700: #a16207;
            --gold-800: #854d0e;
            --gold-900: #713f12;
            
            /* Dark */
            --dark-bg: #0a0a0f;
            --dark-surface: #14141e;
            --dark-card: #1a1a2e;
            --dark-border: rgba(220, 38, 38, 0.15);
            
            /* Glass */
            --glass-bg: rgba(26, 26, 46, 0.6);
            --glass-border: rgba(220, 38, 38, 0.12);
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html.dark {
            background-color: var(--dark-bg);
        }

        body {
            background-color: var(--dark-bg);
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.5s ease;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--blood-600), var(--gold-500));
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--blood-500), var(--gold-400));
        }

        /* ===== GLASSMORPHISM ===== */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .glass-light {
            background: rgba(26, 26, 46, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(220, 38, 38, 0.08);
        }

        .glass-nav {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(220, 38, 38, 0.1);
        }

        .glass-panel {
            background: rgba(19, 27, 46, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
        }

        /* ===== GLOW EFFECTS ===== */
        .blood-glow {
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.15), 0 0 60px rgba(220, 38, 38, 0.05);
        }
        .blood-glow-hover:hover {
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.25), 0 0 80px rgba(220, 38, 38, 0.08);
        }
        .gold-glow {
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.15), 0 0 60px rgba(234, 179, 8, 0.05);
        }
        .blood-pulse {
            animation: bloodPulse 2s ease-in-out infinite;
        }
        @keyframes bloodPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.1); }
            50% { box-shadow: 0 0 40px rgba(220, 38, 38, 0.3), 0 0 80px rgba(220, 38, 38, 0.1); }
        }

        /* ===== TEXT GRADIENTS ===== */
        .text-blood-gold {
            background: linear-gradient(135deg, #dc2626, #eab308, #dc2626);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerBloodGold 3s ease-in-out infinite;
        }
        @keyframes shimmerBloodGold {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== NEON TEXT ===== */
        .neon-blood {
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.5), 0 0 20px rgba(220, 38, 38, 0.3), 0 0 40px rgba(220, 38, 38, 0.1);
        }
        .neon-gold {
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.4), 0 0 20px rgba(234, 179, 8, 0.2);
        }

        /* ===== ROLE STYLES (dari profile.html) ===== */
        .role-owner {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgb-text 3s ease infinite;
            font-weight: 900;
        }
        @keyframes rgb-text {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .role-breaker {
            background: linear-gradient(45deg, #a855f7, #ec4899, #6366f1, #06b6d4, #a855f7);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: nebula-glow 3s ease infinite;
            font-weight: 900;
            filter: drop-shadow(0 0 5px rgba(168, 85, 247, 0.8)) drop-shadow(0 0 10px rgba(6, 182, 212, 0.5));
        }
        @keyframes nebula-glow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .role-nolep {
            background: linear-gradient(45deg, #ff0000, #1a0000, #8b0000, #000000, #ff0000);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: dark-blood 2s ease infinite;
            font-weight: 900;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.8)) drop-shadow(0 0 10px rgba(139, 0, 0, 0.6));
        }
        @keyframes dark-blood {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== AVATAR FRAMES (dari profile.html) ===== */
        .avatar-frame {
            position: relative;
            display: inline-block;
            border-radius: 9999px;
            padding: 4px;
            transition: all 0.3s ease;
        }

        .frame-common {
            background: linear-gradient(135deg, #9ca3af, #4b5563);
            box-shadow: 0 0 10px rgba(156, 163, 175, 0.6);
        }
        .frame-rare {
            background: linear-gradient(135deg, #3b82f6, #06b6d4, #10b981);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.8);
            animation: rare-glow 2s infinite alternate;
        }
        @keyframes rare-glow {
            0% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.6); }
            100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.9); }
        }

        .frame-legendary {
            background: linear-gradient(45deg, #f59e0b, #fef08a, #d97706, #fef08a);
            background-size: 300% 300%;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.9), 0 0 10px rgba(254, 240, 138, 0.8);
            animation: legendary-shine 2.5s infinite linear;
        }
        @keyframes legendary-shine {
            0% { background-position: 0% 50%; box-shadow: 0 0 12px rgba(245, 158, 11, 0.8); }
            50% { background-position: 100% 50%; box-shadow: 0 0 25px rgba(251, 191, 36, 1), 0 0 15px rgba(255, 255, 255, 0.8); }
            100% { background-position: 0% 50%; box-shadow: 0 0 12px rgba(245, 158, 11, 0.8); }
        }

        .frame-mythic {
            background: linear-gradient(270deg, #ec4899, #8b5cf6, #3b82f6, #06b6d4, #ef4444, #ec4899);
            background-size: 400% 400%;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9), 0 0 15px rgba(139, 92, 246, 0.8);
            animation: mythic-aura 3s infinite linear;
        }
        @keyframes mythic-aura {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.8)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.9)); }
            100% { background-position: 0% 50%; filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.8)); }
        }

        .frame-mythic-red {
            background: linear-gradient(270deg, #ff0000, #7f1d1d, #ff4500, #dc2626, #ff0000);
            background-size: 400% 400%;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.9), 0 0 15px rgba(220, 38, 38, 0.8);
            animation: mythic-blood-aura 2.5s infinite linear;
        }
        @keyframes mythic-blood-aura {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.8)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 25px rgba(255, 69, 0, 1)); }
            100% { background-position: 0% 50%; filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.8)); }
        }

        /* ===== BUTTONS ===== */
        .btn-blood {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.2);
        }
        .btn-blood:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.3);
        }

        .btn-gold {
            background: linear-gradient(135deg, #eab308, #a16207);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(234, 179, 8, 0.2);
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(234, 179, 8, 0.3);
        }

        .btn-outline-blood {
            background: transparent;
            color: #dc2626;
            border: 1.5px solid #dc2626;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .btn-outline-blood:hover {
            background: rgba(220, 38, 38, 0.1);
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.1);
        }

        .btn-outline-gold {
            background: transparent;
            color: #eab308;
            border: 1.5px solid #eab308;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .btn-outline-gold:hover {
            background: rgba(234, 179, 8, 0.1);
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.1);
        }

        /* ===== INPUTS ===== */
        .input-blood {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(220, 38, 38, 0.15);
            color: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
            width: 100%;
        }
        .input-blood:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.1);
        }
        .input-blood::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ===== CARDS ===== */
        .card-blood {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .card-blood:hover {
            border-color: rgba(220, 38, 38, 0.3);
            box-shadow: 0 8px 40px rgba(220, 38, 38, 0.08);
        }

        /* ===== API KEY DISPLAY ===== */
        .api-key-display {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(234, 179, 8, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: 'Courier New', monospace;
            color: #eab308;
            letter-spacing: 1px;
            font-size: 14px;
            word-break: break-all;
        }

        /* ===== EXP BAR RGB ===== */
        .rgb-exp-bar {
            background: linear-gradient(90deg, #ff007f, #7928ca, #00dfd8, #0070f3, #10b981, #ff007f);
            background-size: 300% 100%;
            animation: rgb-flow 4s linear infinite;
        }
        @keyframes rgb-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* ===== CUSTOM SCROLLBAR UTILITY ===== */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.4);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(124, 58, 237, 0.7);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .card-blood {
                border-radius: 16px;
            }
            .btn-blood, .btn-gold, .btn-outline-blood, .btn-outline-gold {
                padding: 8px 16px;
                font-size: 13px;
            }
            .glass-panel {
                border-radius: 20px;
            }
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="nav-glass fixed top-0 left-0 right-0 z-50 px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
            <a href="home.html" class="text-xl font-black flex items-center gap-2">
                <span class="text-blood-500">Kyuu</span>
                <span class="text-gold-400">Api</span>
                <span class="text-[10px] text-blood-400/50 font-mono ml-1">v1</span>
            </a>
            
            <div class="flex items-center gap-2 sm:gap-4">
                <a href="docs.html" class="text-sm text-gold-400 font-bold border-b-2 border-gold-400/50 pb-0.5">Docs</a>
                <a href="pricing.html" class="text-sm text-gray-400 hover:text-gold-400 transition font-medium">Pricing</a>
                <a href="about.html" class="text-sm text-gray-400 hover:text-gold-400 transition font-medium">About</a>
                <a href="profile.html" class="text-sm text-gray-400 hover:text-white transition font-medium">
                    <i class="fa-solid fa-user"></i>
                </a>
                <button onclick="logout()" class="text-xs bg-blood-600/20 hover:bg-blood-600/40 text-blood-400 px-3 py-1.5 rounded-lg font-bold transition border border-blood-500/20">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="pt-20 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl sm:text-4xl font-black text-white flex items-center gap-3">
                <i class="fa-solid fa-book text-gold-400"></i>
                Dokumentasi API
            </h1>
            <p class="text-gray-400 mt-2">Base URL: <span class="text-gold-400 font-mono text-sm bg-black/30 px-3 py-1 rounded-lg">https://kyuuapi.eu.cc/api/v1</span></p>
        </div>

        <!-- Search & Filter -->
        <div class="glass rounded-2xl p-4 mb-6 flex flex-col sm:flex-row gap-3">
            <div class="flex-1 relative">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                <input type="text" id="search-endpoint" placeholder="Cari endpoint..." class="input-blood pl-10">
            </div>
            <div class="flex gap-2">
                <select id="filter-method" class="input-blood w-32 bg-black/40">
                    <option value="all">All Methods</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                </select>
                <select id="filter-category" class="input-blood w-32 bg-black/40">
                    <option value="all">All Categories</option>
                    <option value="anime">Anime</option>
                    <option value="manga">Manga</option>
                    <option value="fun">Fun</option>
                    <option value="utility">Utility</option>
                </select>
            </div>
        </div>

        <!-- API Key Input for Testing -->
        <div class="glass rounded-2xl p-4 mb-6 flex flex-col sm:flex-row items-center gap-3">
            <span class="text-sm font-bold text-gray-400 whitespace-nowrap"><i class="fa-solid fa-key text-gold-400 mr-2"></i>API Key:</span>
            <input type="text" id="test-api-key" placeholder="Masukkan API Key untuk testing" class="input-blood flex-1 text-sm">
            <button onclick="setTestApiKey()" class="btn-gold text-sm px-4 py-2">Set Key</button>
        </div>

        <!-- Endpoints List -->
        <div id="endpoints-container" class="space-y-4">
            <!-- Endpoint cards will be rendered by JS -->
            <div class="text-center py-12 text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
                <p class="mt-2">Memuat endpoint...</p>
            </div>
        </div>
    </main>

    <!-- Test Console Modal -->
    <div id="test-modal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-[100] hidden backdrop-blur-md px-4">
        <div class="glass rounded-3xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6 border border-blood-500/20">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-black text-white flex items-center gap-2">
                    <span id="test-method-badge" class="text-xs px-2 py-0.5 rounded font-bold">GET</span>
                    <span id="test-path" class="font-mono text-gold-400">/endpoint</span>
                </h3>
                <button onclick="closeTestModal()" class="text-gray-500 hover:text-white text-xl">&times;</button>
            </div>
            
            <!-- Parameters -->
            <div id="test-params" class="mb-4"></div>
            
            <!-- Response -->
            <div class="mb-4">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Response</label>
                <div id="test-response" class="bg-black/50 rounded-xl p-4 mt-1 font-mono text-sm text-emerald-400 min-h-[100px] overflow-auto whitespace-pre-wrap border border-white/5">
                    <span class="text-gray-500">Klik "Test" untuk menjalankan...</span>
                </div>
            </div>
            
            <!-- Code Snippets -->
            <div class="mb-4">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Code Examples</label>
                <div class="flex gap-2 mt-2 flex-wrap">
                    <button onclick="showCode('curl')" class="text-xs px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 transition font-bold text-gray-300">cURL</button>
                    <button onclick="showCode('js')" class="text-xs px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 transition font-bold text-gray-300">JavaScript</button>
                    <button onclick="showCode('python')" class="text-xs px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 transition font-bold text-gray-300">Python</button>
                    <button onclick="showCode('php')" class="text-xs px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 transition font-bold text-gray-300">PHP</button>
                </div>
                <div id="code-display" class="bg-black/50 rounded-xl p-4 mt-2 font-mono text-xs text-gray-300 overflow-auto max-h-48 border border-white/5">
                    <span class="text-gray-500">Pilih bahasa untuk melihat contoh</span>
                </div>
            </div>
            
            <!-- Actions -->
            <div class="flex gap-3">
                <button onclick="executeTest()" class="btn-gold flex-1 text-sm py-3">
                    <i class="fa-solid fa-play mr-2"></i> Test
                </button>
                <button onclick="closeTestModal()" class="btn-outline-blood text-sm px-6">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        let endpoints = [];
        let currentEndpoint = null;
        let testApiKey = '';

        const ENDPOINTS_DATA = [
            {
                id: 'anime',
                name: 'Get Anime List',
                path: '/anime',
                method: 'GET',
                category: 'anime',
                description: 'Mendapatkan daftar anime terbaru dengan pagination',
                params: [
                    { name: 'page', type: 'number', default: '1', description: 'Halaman' },
                    { name: 'limit', type: 'number', default: '10', description: 'Jumlah per halaman (max 50)' }
                ],
                response: `{
  "status": "success",
  "data": [
    {
      "id": 1,
      "title": "Attack on Titan",
      "episodes": 87,
      "status": "Completed",
      "score": 8.5
    }
  ],

        function renderEndpoints(filtered) {
            const container = document.getElementById('endpoints-container');
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="glass rounded-2xl p-8 text-center">
                        <i class="fa-solid fa-search text-2xl text-gray-500"></i>
                        <p class="text-gray-400 mt-2">Tidak ada endpoint yang ditemukan</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map(ep => {
                const methodColors = {
                    'GET': 'text-emerald-400 bg-emerald-400/10',
                    'POST': 'text-blue-400 bg-blue-400/10',
                    'PUT': 'text-amber-400 bg-amber-400/10',
                    'DELETE': 'text-red-400 bg-red-400/10'
                };
                
                return `
                <div class="glass rounded-2xl p-5 hover:border-blood-500/20 transition border border-transparent" data-id="${ep.id}">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex items-center gap-3 flex-wrap">
                            <span class="text-[10px] font-black px-2.5 py-0.5 rounded ${methodColors[ep.method] || 'text-gray-400 bg-gray-400/10'}">${ep.method}</span>
                            <span class="font-mono text-sm text-gold-400">${ep.path}</span>
                            <span class="text-xs text-gray-500 hidden sm:inline">•</span>
                            <span class="text-xs text-gray-400">${ep.category}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="testEndpoint('${ep.id}')" class="btn-gold text-xs px-4 py-1.5">
                                <i class="fa-solid fa-play"></i> Test
                            </button>
                            <button onclick="copyEndpoint('${ep.id}')" class="btn-outline-blood text-xs px-3 py-1.5">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-sm text-gray-400 mt-2">${ep.description}</p>
                    <div class="flex flex-wrap gap-2 mt-2">
                        ${ep.params.map(p => `
                            <span class="text-[10px] bg-white/5 px-2 py-0.5 rounded-full text-gray-500">
                                ${p.name}: <span class="text-gray-300">${p.default || '?'}</span>
                            </span>
                        `).join('')}
                    </div>
                </div>
            `}).join('');
        }

        function filterEndpoints() {
            const search = document.getElementById('search-endpoint').value.toLowerCase();
            const method = document.getElementById('filter-method').value;
            const category = document.getElementById('filter-category').value;
            
            const filtered = endpoints.filter(ep => {
                const matchSearch = ep.path.toLowerCase().includes(search) || 
                                   ep.name.toLowerCase().includes(search) ||
                                   ep.description.toLowerCase().includes(search);
                const matchMethod = method === 'all' || ep.method === method;
                const matchCategory = category === 'all' || ep.category === category;
                return matchSearch && matchMethod && matchCategory;
            });
            
            renderEndpoints(filtered);
        }

        function testEndpoint(id) {
            const ep = endpoints.find(e => e.id === id);
            if (!ep) return;
            
            currentEndpoint = ep;
            document.getElementById('test-method-badge').innerText = ep.method;
            document.getElementById('test-method-badge').className = `text-xs px-2 py-0.5 rounded font-bold ${
                ep.method === 'GET' ? 'text-emerald-400 bg-emerald-400/10' :
                ep.method === 'POST' ? 'text-blue-400 bg-blue-400/10' :
                'text-amber-400 bg-amber-400/10'
            }`;
            document.getElementById('test-path').innerText = ep.path;
            
            // Generate params
            const paramsDiv = document.getElementById('test-params');
            if (ep.params.length > 0) {
                paramsDiv.innerHTML = `
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Parameters</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
                        ${ep.params.map(p => `
                            <div>
                                <label class="text-[10px] text-gray-500">${p.name} <span class="text-gray-600">(${p.type})</span></label>
                                <input type="text" id="param-${p.name}" placeholder="${p.default || ''}" class="input-blood text-sm py-2">
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                paramsDiv.innerHTML = `
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Parameters</label>
                    <p class="text-sm text-gray-500 mt-1">Tidak ada parameter yang diperlukan</p>
                `;
            }
            
            // Clear response
            document.getElementById('test-response').innerHTML = '<span class="text-gray-500">Klik "Test" untuk menjalankan...</span>';
            document.getElementById('code-display').innerHTML = '<span class="text-gray-500">Pilih bahasa untuk melihat contoh</span>';
            
            document.getElementById('test-modal').classList.remove('hidden');
        }

        function closeTestModal() {
            document.getElementById('test-modal').classList.add('hidden');
        }

        async function executeTest() {
            const ep = currentEndpoint;
            if (!ep) return;
            
            const responseDiv = document.getElementById('test-response');
            responseDiv.innerHTML = '<span class="text-gray-500"><i class="fa-solid fa-spinner fa-spin"></i> Menjalankan...</span>';
            
            // Build URL with params
            const params = {};
            ep.params.forEach(p => {
                const val = document.getElementById(`param-${p.name}`)?.value || p.default || '';
                if (val) params[p.name] = val;
            });
            
            const url = new URL(`https://kyuuapi.eu.cc/api/v1${ep.path}`);
            Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
            
            // Simulate API call with mock
            setTimeout(() => {
                const mockData = ep.mock || { status: "success", message: "Mock response" };
                responseDiv.innerHTML = JSON.stringify(mockData, null, 2);
                responseDiv.className = 'bg-black/50 rounded-xl p-4 mt-1 font-mono text-sm text-emerald-400 min-h-[100px] overflow-auto whitespace-pre-wrap border border-white/5';
            }, 800);
        }

        function showCode(lang) {
            const ep = currentEndpoint;
            if (!ep) return;
            
            const baseUrl = 'https://kyuuapi.eu.cc/api/v1';
            const apiKey = document.getElementById('test-api-key').value || 'YOUR_API_KEY';
            
            let code = '';
            switch(lang) {
                case 'curl':
                    code = `curl -X ${ep.method} "${baseUrl}${ep.path}" \\
  -H "Authorization: Bearer ${apiKey}" \\
  -H "Content-Type: application/json"`;
                    break;
                case 'js':
                    code = `fetch("${baseUrl}${ep.path}", {
  method: "${ep.method}",
  headers: {
    "Authorization": "Bearer ${apiKey}",
    "Content-Type": "application/json"
  }
})
.then(res => res.json())
.then(data => console.log(data))
.catch(err => console.error(err));`;
                    break;
                case 'python':
                    code = `import requests

url = "${baseUrl}${ep.path}"
headers = {
    "Authorization": "Bearer ${apiKey}",
    "Content-Type": "application/json"
}

response = requests.${ep.method.toLowerCase()}(
    url, 
    headers=headers
)
print(response.json())`;
                    break;
                case 'php':
                    code = `<?php
$curl = curl_init();

curl_setopt_array($curl, [
    CURLOPT_URL => "${baseUrl}${ep.path}",
    CURLOPT_RETURNTRANSFER => true,
    CURLOPT_CUSTOMREQUEST => "${ep.method}",
    CURLOPT_HTTPHEADER => [
        "Authorization: Bearer ${apiKey}",
        "Content-Type: application/json"
    ]
]);

$response = curl_exec($curl);
$data = json_decode($response, true);
print_r($data);
?>`;
                    break;
            }
            
            document.getElementById('code-display').innerText = code;
        }

        function copyEndpoint(id) {
            const ep = endpoints.find(e => e.id === id);
            if (ep) {
                const url = `https://kyuuapi.eu.cc/api/v1${ep.path}`;
                navigator.clipboard.writeText(url);
                alert('Endpoint URL berhasil disalin!');
            }
        }

        function setTestApiKey() {
            const key = document.getElementById('test-api-key').value;
            if (key) {
                testApiKey = key;
                alert('API Key berhasil dipasang untuk testing!');
            }
        }

        async function logout() {
            if (typeof supabaseClient !== 'undefined') {
                await supabaseClient.auth.signOut();
            } else if (typeof supabase !== 'undefined') {
                await supabase.auth.signOut();
            }
            window.location.href = 'auth.html';
        }

        // Initialize ketika HTML selesai dimuat
        document.addEventListener('DOMContentLoaded', () => {
            endpoints = ENDPOINTS_DATA;
            renderEndpoints(endpoints);
            
            // Filter Events
            document.getElementById('search-endpoint').addEventListener('input', filterEndpoints);
            document.getElementById('filter-method').addEventListener('change', filterEndpoints);
            document.getElementById('filter-category').addEventListener('change', filterEndpoints);
        });
    </script>
